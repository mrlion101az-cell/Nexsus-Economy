# NexusEconomy default shop data -- ORIGINAL pricing, not extracted from
# any other plugin.
#
# Every item below is priced by TIER, not a hand-typed number -- each
# tier's actual $ buy/sell values live in one place, config.yml's
# shop.pricing-tiers, so retuning a tier there re-prices every item
# that uses it at once. The tiers track how many real steps it takes to
# get something (SCRAP = lying on the ground or one furnace away, up
# through MYTHIC = the hardest gets in the game), not just a flat
# rarity label -- see the comment above pricing-tiers in config.yml for
# the full breakdown and the reasoning behind the numbers.
#
#   material: MATERIAL_NAME
#   tier: SCRAP | COMMON | STANDARD | REFINED | PRECIOUS | EXOTIC | MYTHIC
#
# For the rare genuine one-off (a trophy that shouldn't have a farmable
# sell price, or a price that just doesn't fit a tier), skip "tier:" and
# set buy/sell directly instead, same as before -- Nether Star and
# Beacon below do this. Set sell: -1 to make something buy-only.
#
# This is a deliberately small STARTER catalog, not an exhaustive list --
# it's meant to be easy to read and easy to extend. Add more entries the
# same way.
#
# You don't need to hand-list every block, though: config.yml's
# shop.auto-blocks section automatically adds every remaining placeable
# block in the game across the shop's tabs at load time (skipping
# anything already listed here by hand, and pricing from the same tier
# table via tab-default-tier / tier-overrides), so full block coverage
# never needs to be kept in sync by hand.

