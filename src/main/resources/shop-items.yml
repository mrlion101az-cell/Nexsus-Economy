# NexusEconomy default shop data -- ORIGINAL pricing, not extracted from
# any other plugin.
#
# catalog-version bumps whenever this file's bundled content changes in
# a way that needs to reach servers that already have an old copy on
# disk -- ShopManager checks this on load, and if the on-disk file is
# older, backs it up (nothing is silently lost) and installs the fresh
# one instead of silently running on stale prices forever.
catalog-version: 3

# Every item below has its OWN hand-picked buy/sell price, in dollars
# and cents -- not a shared bucket. Prices are meant to track how many
# real steps it takes to get that specific item (mining + smelting +
# crafting, mob-kill RNG, boss fights, whatever it actually takes), so
# similar-effort items land in similar ranges without every item in
# that range being identical:
#
#   material: MATERIAL_NAME
#   buy: 123.45
#   sell: 67.89
#
# Set sell: -1 to make something buy-only (a trophy nobody should be
# able to farm for free money, like Nether Star or Beacon below).
#
# If you'd rather not hand-price something individually, you can still
# use "tier: SCRAP|COMMON|STANDARD|REFINED|PRECIOUS|EXOTIC|MYTHIC"
# instead of buy/sell -- that resolves its price from the shared
# shop.pricing-tiers table in config.yml instead. Nothing here uses that
# right now, but the auto-generated block catalog (config.yml's
# shop.auto-blocks section, for every remaining placeable block in the
# game) does, since hand-pricing all ~900 of those isn't practical --
# see the comment above shop.pricing-tiers in config.yml for that side
# of things.
#
# IMPORTANT -- keep this list's low end lined up with the SCRAP/COMMON
# tiers in config.yml (currently $20/$75 sell): if a hand-priced trivial
# item here sits noticeably below what an equally-trivial AUTO-priced
# block gets (dirt vs. sand, for instance), it'll look broken even
# though nothing's technically wrong -- both scales need to move
# together. This file and the tier table drifted out of sync once
# already; don't let it happen again.
#
# Storage blocks (iron block, diamond block, etc.) are priced as roughly
# 9x their ingredient plus a small premium, not an arbitrary number -- if
# you reprice an ingredient, its storage block below should move with
# it, or selling the loose ingredients becomes worth more than the
# block, which nobody will ever craft the block for again.

