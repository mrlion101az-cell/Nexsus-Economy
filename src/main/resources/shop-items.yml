# NexusEconomy default shop data -- ORIGINAL pricing, not extracted from
# any other plugin. Every price here comes from a simple five-tier
# rarity formula I chose myself:
#
#   COMMON:    buy $2.00    sell $1.00
#   UNCOMMON:  buy $6.00    sell $3.00
#   RARE:      buy $20.00   sell $10.00
#   EPIC:      buy $60.00   sell $30.00
#   LEGENDARY: buy $250.00  sell $100.00
#
# This is a deliberately small STARTER catalog, not an exhaustive list --
# it's meant to be easy to read and easy to extend. Add more entries the
# same way: material, buy, sell. Set sell: -1 to make something
# buy-only (a trophy/decorative item nobody should be able to farm for
# free money).

