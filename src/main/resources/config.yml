# NexusEconomy configuration

economy:
  # balance a brand-new player starts with
  starting-balance: 0.0
  # decimal places shown/kept -- Vault plugins query this via fractionalDigits()
  fractional-digits: 2
  currency-singular: "Dollar"
  currency-plural: "Dollars"

# Physical cash: withdraw part of your bank balance as real, tradeable items in
# these denominations, and deposit them back later. Amounts are broken down
# greedily from largest to smallest denomination.
cash:
  denominations: [100, 50, 20, 10, 5, 1]

shop:
  # multiplies every price in shop-items.yml -- lets you retune the whole
  # shop up or down at once without hand-editing every entry. 1.0 = no change.
  sell-price-multiplier: 1.0
  buy-price-multiplier: 1.0

auction:
  # server-generated auctions on top of whatever players list themselves
  auto-enabled: true
  # how often (minutes) a new automatic server auction appears
  auto-interval-minutes: 30
  # how long (minutes) each auction runs once listed, both server and player
  duration-minutes: 60
  # pool the server picks randomly from for its own auctions -- fully yours
  # to edit; add/remove/reprice entries freely
  pool:
    - material: DIAMOND
      amount: 1
      start-price: 15.0
    - material: EMERALD
      amount: 4
      start-price: 20.0
    - material: NETHERITE_INGOT
      amount: 1
      start-price: 120.0
    - material: GOLDEN_APPLE
      amount: 2
      start-price: 15.0
    - material: ENDER_PEARL
      amount: 8
      start-price: 12.0

credit:
  # a new player's starting credit line and score
  starting-limit: 500.0
  starting-score: 650
  min-score: 300
  max-score: 850
  # applied to whatever's left unpaid at the end of each billing cycle
  monthly-interest-rate: 0.02
  # minimum payment due each cycle: the larger of (balance * percent) and the floor
  minimum-payment-percent: 0.03
  minimum-payment-floor: 10.0
  # charged on top of the balance if last cycle's minimum wasn't paid
  late-fee: 25.0
  score-penalty-per-missed-payment: 30
  score-bonus-per-ontime-payment: 5
  # consecutive missed cycles before the account freezes (charging blocked until paid down)
  freeze-after-missed-payments: 3
  # billing is driven directly by NexusSeasons' day counter when it's installed --
  # the instant the day rolls from its max (30 by default) back to 1, that's a new
  # month and a billing cycle runs. If NexusSeasons isn't installed, this real-time
  # interval is used instead so credit still works standalone.
  fallback-billing-interval-hours: 168

bank:
  # savings interest, paid on the SAME billing cycle as credit (one season
  # change, or the real-time fallback if NexusSeasons isn't installed)
  interest-enabled: true
  interest-rate: 0.01
  # balances below this don't earn interest -- avoids meaningless fraction-of-a-cent payouts
  interest-minimum-balance: 1.0
  # preset one-click withdraw amounts shown in the /bank GUI -- /bank withdraw <amount>
  # still works for any exact whole-dollar amount not listed here
  withdraw-presets: [10, 50, 100, 500, 1000]
